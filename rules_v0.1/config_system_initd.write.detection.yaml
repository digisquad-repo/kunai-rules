# Detects writes to SysV init.d scripts — legacy boot persistence mechanism.
---
name: config_system_initd.write.detection
type: detection
meta:
  tags: [
      "config_system_initd",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1037.004", "boot_or_logon_initialization_scripts:_rc_scripts",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1037.004 ]
  # Boot or Logon Initialization Scripts: RC Scripts
  comments:
    - detection rule - identify config_system_initd_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_system_initd_list.write.dependency)
condition: $dep_01
severity: 8
