# Detects writes to cron job directories (/etc/cron.d, /var/spool/cron/) — scheduled task persistence.
---
name: config_system_cron.write.detection
type: detection
meta:
  tags: [
      "config_system_cron",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1053.003", "scheduled_task/job:_cron",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1053.003 ]
  # Scheduled Task/Job: Cron
  comments:
    - detection rule - identify config_system_cron_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_system_cron_list.write.dependency)
condition: $dep_01
severity: 8
