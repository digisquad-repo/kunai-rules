# Detects execution of SSH clients (ssh, sftp, scp, mosh, etc.) — lateral movement via SSH.
---
name: bin_network_ssh_client.execve.detection
type: detection
meta:
  tags: [
      "bin_network_ssh_client",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1021.004", "remote_services:_ssh",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1021.004 ]
  # Remote Services: SSH
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_network_ssh_client_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_network_ssh_client_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 7
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
