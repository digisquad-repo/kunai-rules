# Detects network connections from basic daily commands (ls, cat, etc.) — these tools should never initiate network connections.
---
name: bin_daily_cmd.connect.detection
type: detection
meta:
  tags: [
      "bin_daily_cmd",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1059.004", "command_and_scripting_interpreter:_unix_shell",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1059.004 ]
  # Command and Scripting Interpreter: Unix Shell
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_daily_cmd_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_daily_cmd_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 10 # This should not happen.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####  
