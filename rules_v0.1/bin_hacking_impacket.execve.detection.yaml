# Detects execution of Impacket suite tools (secretsdump, psexec, wmiexec, smbclient, etc.) — credential dumping and lateral movement.
---
name: bin_hacking_impacket.execve.detection
type: detection
meta:
  tags: [
      "bin_hacking_impacket",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1003", "os_credential_dumping",
      "T1550", "use_alternate_authentication_material",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1003, T1550 ]
  # OS Credential Dumping
  # Use Alternate Authentication Material
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_hacking_impacket_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_hacking_impacket_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 9
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
