# Detects execution of compression/archiving tools (tar, zip, 7z, etc.) — may be used to pack data before exfiltration.
---
name: bin_compression.execve.detection
type: detection
meta:
  tags: [
      "bin_compression",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1027.002", "obfuscated_files_or_information:_software_packing",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1027.002 ]
  # Obfuscated Files or Information: Software Packing
  comments:
    - detection rule - identify bin_compression_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_compression_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 3
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

