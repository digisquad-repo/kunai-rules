# Detects execution of headless browsers (phantomjs, puppeteer-driven chrome, etc.) which are commonly used for automation attacks.
---
name: bin_browsers_headless.execve.detection
type: detection
meta:
  tags: [
      "bin_browsers_headless",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1059.007", "command_and_scripting_interpreter:_javascript",
      "T1071.001", "application_layer_protocol:_web_protocols",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1059.007 ]
  # Command and Scripting Interpreter: JavaScript
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_browsers_headless_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_browsers_headless_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

