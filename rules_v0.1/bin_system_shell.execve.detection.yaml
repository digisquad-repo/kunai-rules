# Detects execution of system shells (bash, sh, zsh, ksh, etc.) — may indicate interactive attacker session or script execution.
---
name: bin_system_shell.execve.detection
type: detection
meta:
  tags: [
      "bin_system_shell",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1059.004", "command_and_scripting_interpreter:_unix_shell",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1059.004 ]
  # Command and Scripting Interpreter: Unix Shell
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_system_shell_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_system_shell_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
