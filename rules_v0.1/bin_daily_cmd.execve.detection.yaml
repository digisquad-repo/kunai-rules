# Detects execution of common daily commands (ls, cp, mv, cat, etc.). Very low severity informational rule for baselining.
---
name: bin_daily_cmd.execve.detection
type: detection
meta:
  tags: [
      "bin_daily_cmd",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1059.004", "command_and_scripting_interpreter:_unix_shell",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1059.004 ]
  # Command and Scripting Interpreter: Unix Shell
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_daily_cmd_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_daily_cmd_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 1 # It might be noisy. Personally I prefer to keep it active. Up to you.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
