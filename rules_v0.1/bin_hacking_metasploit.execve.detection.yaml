# Detects execution of Metasploit framework tools (msfconsole, msfvenom, msfdb, etc.).
---
name: bin_hacking_metasploit.execve.detection
type: detection
meta:
  tags: [
      "bin_hacking_metasploit",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1587.001", "develop_capabilities:_malware",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1587.001 ]
  # Develop Capabilities: Malware
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_hacking_metasploit_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_hacking_metasploit_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 9
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
