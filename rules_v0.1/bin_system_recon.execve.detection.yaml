# Detects execution of system reconnaissance tools (whoami, id, uname, lsof, getcap, etc.) — attacker discovery phase.
---
name: bin_system_recon.execve.detection
type: detection
meta:
  tags: [
      "bin_system_recon",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1082", "system_information_discovery",
      "T1033", "system_owner/user_discovery",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1082, T1033 ]
  # System Information Discovery
  # System Owner/User Discovery
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_system_recon_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_system_recon_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 6
