# Detects network connections from mount tools — mount utilities initiating connections is highly unusual.
---
name: bin_filesystem_mount.connect.detection
type: detection
meta:
  tags: [
      "bin_filesystem_mount",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1005", "data_from_local_system",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1005 ]
  # Data from Local System
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_filesystem_mount_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_filesystem_mount_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 9
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####  
