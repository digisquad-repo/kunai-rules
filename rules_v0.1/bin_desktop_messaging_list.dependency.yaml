  $bin_dep_02: .data.ancestors ~= "/[^/]*/(signal|signal-desktop|slack|discord|telegram|telegram-desktop|teams|zoom|element-desktop|riot-desktop|mattermost|rocketchat)(-[a-zA-Z0-9._]+)?$"

