# Detects writes to Docker daemon configuration files — may indicate container escape preparation or privilege escalation.
---
name: config_container_docker.write.detection
type: detection
meta:
  tags: [
      "config_container_docker",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write", 
      "event_write_close", 
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1610", "deploy_container",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1610 ]
  # Deploy Container
  comments:
    - detection rule - identify config_container_docker_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_container_docker_list.write.dependency)
condition: $dep_01
severity: 8



