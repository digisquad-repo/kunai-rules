# Detects writes to systemd unit files (/etc/systemd/system/, /usr/lib/systemd/system/) — service persistence.
---
name: config_system_systemd.write.detection
type: detection
meta:
  tags: [
      "config_system_systemd",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1543.002", "create_or_modify_system_process:_systemd_service",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1543.002 ]
  # Create or Modify System Process: Systemd Service
  comments:
    - detection rule - identify config_system_systemd_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_system_systemd_list.write.dependency)
condition: $dep_01
severity: 8
