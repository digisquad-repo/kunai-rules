# Detects execution of forensic tools (dd, strings, hexdump, autopsy, etc.) — may indicate data collection or anti-forensics.
---
name: bin_forensics.execve.detection
type: detection
meta:
  tags: [
      "bin_forensics",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1005", "data_from_local_system",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1005 ]
  # Data from Local System
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_forensics_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_forensics_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

