# Detects DNS queries with hex-encoded or very long first labels — DNS exfiltration pattern using base64/hex-encoded subdomains.
---
name: net_dns_exfil.dns_query.detection
type: detection
meta:
  tags: [
      "net_dns_exfil",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_dns_query",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1071.004", "application_layer_protocol:_dns",
    ]
  attack: [ T1071.004 ]
  # Application Layer Protocol: DNS
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  comments:
    - detection rule - identify DNS queries with long hex/base64 first labels (DNS exfiltration pattern)

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [dns_query]

matches:
  $hex_subdomain: .data.query ~= "^[0-9a-fA-F]{20,}\."
  $long_sublabel: .data.query ~= "^[^.]{40,}\."
condition: any of $hex_subdomain, $long_sublabel

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 8
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
