# Detects SMB client tools executing — lateral movement via Windows share access or admin share enumeration.
---
name: bin_network_smb_client.execve.detection
type: detection
meta:
  tags: [
      "bin_network_smb_client",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1021.002", "remote_services:_smb/windows_admin_shares",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1021.002 ]
  # Remote Services: SMB/Windows Admin Shares
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_network_smb_client_list.dependency (lateral movement / admin activity)

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_network_smb_client_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 6
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
