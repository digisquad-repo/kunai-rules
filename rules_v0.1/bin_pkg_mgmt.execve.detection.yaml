# Detects execution of package managers (apt, dpkg, pip, npm, gem, etc.) — may be used for installing attack tools.
---
name: bin_pkg_mgmt.execve.detection
type: detection
meta:
  tags: [
      "bin_pkg_mgmt",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1105", "ingress_tool_transfer",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1105 ]
  # Ingress Tool Transfer
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_pkg_mgmt_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_pkg_mgmt_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 4
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
