# Detects writes to network interface configuration files — may indicate traffic interception setup or network covert channel.
---
name: config_network_card.write.detection
type: detection
meta:
  tags: [
      "config_network_card",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1205", "traffic_signaling",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1205 ]
  # Traffic Signaling
  comments:
    - detection rule - identify config_network_card_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_network_card_list.write.dependency)
condition: $dep_01
severity: 8
