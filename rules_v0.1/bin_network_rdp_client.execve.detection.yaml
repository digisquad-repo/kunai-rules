# Detects execution of RDP clients (rdesktop, xfreerdp, etc.) — unexpected RDP usage may indicate lateral movement.
---
name: bin_network_rdp_client.execve.detection
type: detection
meta:
  tags: [
      "bin_network_rdp_client",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1021.001", "remote_services:_remote_desktop_protocol",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1021.001 ]
  # Remote Services: Remote Desktop Protocol
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_network_rdp_client_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_network_rdp_client_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 7
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
