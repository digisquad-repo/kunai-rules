# Detects execution of wireless attack tools (aircrack-ng, airodump-ng, wifite, etc.) — wireless network attacks.
---
name: bin_hacking_wireless.execve.detection
type: detection
meta:
  tags: [
      "bin_hacking_wireless",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1040", "network_sniffing",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1040 ]
  # Network Sniffing
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_hacking_wireless_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule(bin_hacking_wireless_list.dependency)
condition: $bin_dep_01

