# Detects writes to dm-crypt/LUKS configuration — may indicate ransomware encryption setup or disk wiping preparation.
---
name: config_dmcrypt.write.detection
type: detection
meta:
  tags: [
      "config_dmcrypt",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write", 
      "event_write_close", 
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1486", "data_encrypted_for_impact",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1486 ]
  # Data Encrypted for Impact
  comments:
    - detection rule - identify config_dmcrypt_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_dmcrypt_list.write.dependency)
condition: $dep_01
severity: 8



