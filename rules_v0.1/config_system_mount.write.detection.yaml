# Detects writes to mount configuration (/etc/fstab, /etc/mtab) — filesystem configuration tampering.
---
name: config_system_mount.write.detection
type: detection
meta:
  tags: [
      "config_system_mount",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1052", "exfiltration_over_physical_medium",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1052 ]
  # Exfiltration Over Physical Medium
  comments:
    - detection rule - identify config_system_mount_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_system_mount_list.write.dependency)
condition: $dep_01
severity: 8
