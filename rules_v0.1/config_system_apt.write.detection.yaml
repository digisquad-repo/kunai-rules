# Detects writes to APT configuration files (/etc/apt/apt.conf.d/) — APT hook persistence mechanism on Ubuntu/Debian.
---
name: config_system_apt.write.detection
type: detection
meta:
  tags: [
      "config_system_apt",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1546", "event_triggered_execution",
    ]
  attack: [ T1546 ]
  # Event Triggered Execution
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  comments:
    - detection rule - identify write to /etc/apt/apt.conf.d (APT hook persistence - Ubuntu)

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_system_apt_list.write.dependency)
condition: $dep_01
severity: 8
