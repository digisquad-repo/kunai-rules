# Detects execution of kernel module tools (insmod, modprobe, rmmod) — may indicate rootkit or malicious module loading.
---
name: bin_kernel.execve.detection
type: detection
meta:
  tags: [
      "bin_kernel",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1547.006", "boot_or_logon_autostart_execution:_kernel_modules_and_extensions",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1547.006 ]
  # Boot or Logon Autostart Execution: Kernel Modules
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_kernel_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_kernel_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 8
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
