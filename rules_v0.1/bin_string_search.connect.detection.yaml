# Detects network connections from string search tools — grep/awk initiating connections is highly suspicious.
---
name: bin_string_search.connect.detection
type: detection
meta:
  tags: [
      "bin_string_search",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1119", "automated_collection",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1119 ]
  # Automated Collection
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_string_search_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_string_search_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 9 # This should not happen.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####  
