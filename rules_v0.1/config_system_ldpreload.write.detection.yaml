# Detects writes to /etc/ld.so.preload or ld.so.conf.d — dynamic linker hijacking used by rootkits to inject malicious libraries into every process.
---
name: config_system_ldpreload.write.detection
type: detection
meta:
  tags: [
      "config_system_ldpreload",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1574.006", "hijack_execution_flow:_dynamic_linker_hijacking",
    ]
  attack: [ T1574.006 ]
  # Hijack Execution Flow: Dynamic Linker Hijacking
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  comments:
    - detection rule - identify write to /etc/ld.so.preload or ld.so.conf.d (rootkit/library injection)

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_system_ldpreload_list.write.dependency)
condition: $dep_01
severity: 10
