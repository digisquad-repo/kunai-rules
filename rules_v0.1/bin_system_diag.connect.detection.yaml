# Detects network connections from system diagnostic tools — ps, top, dmesg etc. initiating connections is extremely suspicious.
---
name: bin_system_diag.connect.detection
type: detection
meta:
  tags: [
      "bin_system_diag",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1057", "process_discovery",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1057 ]
  # Process Discovery
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_system_diag_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_system_diag_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 9 # This should not happen.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####  
