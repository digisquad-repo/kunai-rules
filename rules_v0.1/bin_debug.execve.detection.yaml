# Detects execution of debuggers (gdb, strace, ltrace, etc.) — may indicate process inspection or injection attempts.
---
name: bin_debug.execve.detection
type: detection
meta:
  tags: [
      "bin_debug",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1082", "system_information_discovery",
      "T1049", "system_network_connections_discovery",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1082, T1049 ]
  # System Information Discovery (strace) / System Network Connections Discovery (lsof)
  comments:
    - detection rule - identify bin_debug_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_debug_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
