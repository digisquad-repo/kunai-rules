# Detects writes to DNS configuration files (/etc/hosts, /etc/resolv.conf) — DNS hijacking or traffic redirection.
---
name: config_network_dns.write.detection
type: detection
meta:
  tags: [
      "config_network_dns",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1565.001", "data_manipulation:_stored_data_manipulation",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1565.001 ]
  # Data Manipulation: Stored Data Manipulation
  comments:
    - detection rule - identify config_network_dns_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_network_dns_list.write.dependency)
condition: $dep_01
severity: 8
