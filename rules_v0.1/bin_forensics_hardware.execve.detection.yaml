# Detects execution of hardware forensic tools (lshw, dmidecode, hdparm, smartctl, etc.) — hardware enumeration by an attacker.
---
name: bin_forensics_hardware.execve.detection
type: detection
meta:
  tags: [
      "bin_forensics_hardware",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1005", "data_from_local_system",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1005 ]
  # Data from Local System
  comments:
    - detection rule - identify bin_forensics_hardware_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_forensics_hardware_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 6
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
