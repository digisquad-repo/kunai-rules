matches:
  $bin_dep_01: .data.exe.path ~= "/[^/]*/(find)(-[a-zA-Z0-9._]+)?$"
  $bin_dep_02: .data.exe.path ~= "/[^/]*/(locate|mlocate|plocate|slocate)(-[a-zA-Z0-9._]+)?$"
  $bin_dep_03: .data.exe.path ~= "/[^/]*/(updatedb)(-[a-zA-Z0-9._]+)?$"
  $bin_dep_04: .data.exe.path ~= "/[^/]*/(tree|fd|fdfind)(-[a-zA-Z0-9._]+)?$"

condition: any of $bin_dep_
