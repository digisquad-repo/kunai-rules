# Detects execution of compilers/linkers (gcc, clang, make, etc.) — may indicate on-host compilation of attacker tools.
---
name: bin_build.execve.detection
type: detection
meta:
  tags: [
      "bin_build",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1587.001", "develop_capabilities:_malware",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1587.001 ]
  # Develop Capabilities: Malware
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_build_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_build_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
