# Detects writes to kernel configuration files (/boot/grub, /etc/sysctl.d, etc.) — kernel parameter tampering or bootloader modification.
---
name: config_kernel.write.detection
type: detection
meta:
  tags: [
      "config_kernel",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1547.006", "boot_or_logon_autostart_execution:_kernel_modules_and_extensions",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1547.006 ]
  # Boot or Logon Autostart Execution: Kernel Modules
  comments:
    - detection rule - identify config_kernel_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_kernel_list.write.dependency)
condition: $dep_01
severity: 8
