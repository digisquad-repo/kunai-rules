# Detects writes to SSL/TLS certificate and key files — may indicate rogue certificate installation for traffic interception.
---
name: config_openssl.write.detection
type: detection
meta:
  tags: [
      "config_openssl",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1553.004", "subvert_trust_controls:_install_root_certificate",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1553.004 ]
  # Subvert Trust Controls: Install Root Certificate
  comments:
    - detection rule - identify config_openssl_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_openssl_list.write.dependency)
condition: $dep_01
severity: 8
