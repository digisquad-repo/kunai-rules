# Detects execution of firewall management tools (iptables, nftables, ufw, firewalld) — may indicate disabling/modifying firewall rules.
---
name: bin_network_firewall.execve.detection
type: detection
meta:
  tags: [
      "bin_network_firewall",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1562.004", "impair_defenses:_disable_or_modify_system_firewall",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1562.004 ]
  # Impair Defenses: Disable or Modify System Firewall
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_network_firewall_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_network_firewall_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 6
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
