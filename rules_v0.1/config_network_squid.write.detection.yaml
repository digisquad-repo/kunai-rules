      "config_network_squid",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1090", "proxy",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1090 ]
  # Proxy
  comments:
    - detection rule - identify config_network_squid_list.write.dependency

match-on:
