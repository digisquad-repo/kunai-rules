# Detects execution of network administration tools (ifconfig, ip, route, arp, etc.) — network configuration discovery.
---
name: bin_network_admin.execve.detection
type: detection
meta:
  tags: [
      "bin_network_admin",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1016", "system_network_configuration_discovery",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1016 ]
  # System Network Configuration Discovery
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_network_admin_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_network_admin_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
