# Detects execution of system diagnostic tools (ps, top, htop, lsmod, journalctl, etc.) — process/system discovery.
---
name: bin_system_diag.execve.detection
type: detection
meta:
  tags: [
      "bin_system_diag",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1057", "process_discovery",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1057 ]
  # Process Discovery
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_system_diag_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_system_diag_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 4
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
