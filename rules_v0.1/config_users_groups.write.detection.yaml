# Detects writes to /etc/passwd, /etc/shadow, /etc/group — account creation or privilege modification.
---
name: config_users_groups.write.detection
type: detection
meta:
  tags: [
      "config_users_groups",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1098", "account_manipulation",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1098 ]
  # Account Manipulation
  comments:
    - detection rule - identify config_users_groups_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_users_groups_list.write.dependency)
condition: $dep_01
severity: 8
