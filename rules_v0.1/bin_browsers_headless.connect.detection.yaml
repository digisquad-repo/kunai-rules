# Detects network connections from headless browsers — suspicious as these browsers have no legitimate interactive use on servers.
---
name: bin_browsers_headless.connect.detection
type: detection
meta:
  tags: [
      "bin_browsers_headless",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1071.001", "application_layer_protocol:_web_protocols",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1071.001 ]
  # Application Layer Protocol: Web Protocols
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_browsers_headless_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_browsers_headless_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####  
