# Detects execution of HTTP clients (curl, wget, httpie, etc.) — commonly used for C2 communication and payload download.
---
name: bin_network_http_client.execve.detection
type: detection
meta:
  tags: [
      "bin_network_http_client",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1071.001", "application_layer_protocol:_web_protocols",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1071.001 ]
  # Application Layer Protocol: Web Protocols
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_network_http_client_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_network_http_client_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 6
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
