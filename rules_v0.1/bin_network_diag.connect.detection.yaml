# Detects network connections from network diagnostic tools — suspicious when tools like tcpdump initiate their own connections.
---
name: bin_network_diag.connect.detection
type: detection
meta:
  tags: [
      "bin_network_diag",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1049", "system_network_connections_discovery",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1049 ]
  # System Network Connections Discovery
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_network_diag_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_network_diag_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 6
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
