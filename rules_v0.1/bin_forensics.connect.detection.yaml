# Detects network connections from forensic tools — forensic tools calling out to the internet is highly suspicious.
---
name: bin_forensics.connect.detection
type: detection
meta:
  tags: [
      "bin_forensics",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1005", "data_from_local_system",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1005 ]
  # Data from Local System
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_forensics_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_forensics_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 9 # This should not happen.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

