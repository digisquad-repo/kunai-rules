# Detects execution of script interpreters (python, perl, ruby, php, node, etc.) — used for executing attacker scripts.
---
name: bin_script_interpreters.execve.detection
type: detection
meta:
  tags: [
      "bin_script_interpreters",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1059", "command_and_scripting_interpreter",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1059 ]
  # Command and Scripting Interpreter
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_script_interpreters_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_script_interpreters_list.dependency)
condition: $bin_dep_01
  
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
