# Detects network connections from kernel module tools — these tools have no legitimate network activity.
---
name: bin_kernel.connect.detection
type: detection
meta:
  tags: [
      "bin_kernel",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1547.006", "boot_or_logon_autostart_execution:_kernel_modules_and_extensions",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1547.006 ]
  # Boot or Logon Autostart Execution: Kernel Modules
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_kernel_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule( bin_kernel_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 8
