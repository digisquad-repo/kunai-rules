# Detects writes to SELinux configuration — security policy tampering to disable mandatory access controls.
---
name: config_system_selinux.write.detection
type: detection
meta:
  tags: [
      "config_system_selinux",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1562.001", "impair_defenses:_disable_or_modify_tools",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1562.001 ]
  # Impair Defenses: Disable or Modify Tools
  comments:
    - detection rule - identify config_system_selinux_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_system_selinux_list.write.dependency)
condition: $dep_01
severity: 8
