# Detects reads of sensitive credential files (/etc/shadow, sudoers, SSH host keys, krb5.keytab) — credential access via system files.
---
name: config_credential_access.read_config.detection
type: detection
meta:
  tags: [
      "config_credential_access",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_read_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1003.008", "os_credential_dumping:/etc/passwd_and_/etc/shadow",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1003.008 ]
  # OS Credential Dumping: /etc/passwd and /etc/shadow
  comments:
    - detection rule - identify READ_CONFIG on sensitive credential files (/etc/shadow, /etc/sudoers, SSH host keys)

match-on:
  events:
    kunai:
      - read_config

matches:
  $is_sensitive: rule( path_sensitive_config_list.read_config.dependency)
condition: $is_sensitive
severity: 8
