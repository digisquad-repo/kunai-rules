# Detects execution of C2 framework tools (Cobalt Strike, Empire, Sliver, Covenant, Havoc, etc.).
---
name: bin_hacking_c2_framework.execve.detection
type: detection
meta:
  tags: [
      "bin_hacking_c2_framework",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1071", "application_layer_protocol",
      "T1572", "protocol_tunneling",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1071, T1572 ]
  # Application Layer Protocol
  # Protocol Tunneling
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_hacking_c2_framework_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_hacking_c2_framework_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 10
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
