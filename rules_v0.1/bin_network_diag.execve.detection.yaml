# Detects execution of network diagnostic tools (netstat, ss, tcpdump, ping, traceroute, etc.) — network connections discovery.
---
name: bin_network_diag.execve.detection
type: detection
meta:
  tags: [
      "bin_network_diag",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1049", "system_network_connections_discovery",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1049 ]
  # System Network Connections Discovery
  comments:
    - detection rule - identify EXECVE EXECVE_SCRIPT bin_network_diag_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_network_diag_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 5
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
