    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  comments:
    - dependency - bin_system_account_mgmt_list.dependency - account creation and management tools

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

matches:
  $bin_dep_01: .data.exe.path ~= "/[^/]*/(useradd|adduser|usermod|groupadd|groupmod|newusers|passwd|chpasswd|deluser|userdel|groupdel)(-[a-zA-Z0-9._]+)?$"
  $bin_dep_02: .data.ancestors ~= "/[^/]*/(useradd|adduser|usermod|groupadd|groupmod|newusers|passwd|chpasswd|deluser|userdel|groupdel)(-[a-zA-Z0-9._]+)?$"

condition: any of $bin_dep_
