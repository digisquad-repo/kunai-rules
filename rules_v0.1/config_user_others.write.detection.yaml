# Detects writes to miscellaneous user configuration files — account manipulation or persistence via user config.
---
name: config_user_others.write.detection
type: detection
meta:
  tags: [
      "config_user_others",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1098", "account_manipulation",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1098 ]
  # Account Manipulation
  comments:
    - detection rule - identify config_user_others_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_user_others_list.write.dependency)
condition: $dep_01
severity: 8
