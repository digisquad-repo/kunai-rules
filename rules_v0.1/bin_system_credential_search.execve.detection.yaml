# Detects grep/rg/awk searching for credential-related terms (password, secret, api_key, id_rsa) — T1552.001 credential hunting in files.
---
name: bin_system_credential_search.execve.detection
type: detection
meta:
  tags: [
      "bin_system_credential_search",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1552.001", "unsecured_credentials:_credentials_in_files",
    ]
  attack: [ T1552.001 ]
  # Unsecured Credentials: Credentials in Files
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  comments:
    - detection rule - identify grep/rg searching for password, api_key, id_rsa, private key terms in files

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $is_grep:         .data.exe.path ~= "/[^/]*/(grep|egrep|fgrep|rg|ag)(-[a-zA-Z0-9._]+)?$"
  $cred_terms:      .data.command_line ~= "(password|passwd|secret|credentials|api.key|private.key|id_rsa|id_ecdsa|id_ed25519|\.pem|\.key|access_token|auth_token|aws_secret)"
condition: $is_grep and $cred_terms

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 8
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
