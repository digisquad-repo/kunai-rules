# Detects writes to SSH server configuration (sshd_config, authorized_keys) — backdoor SSH access setup.
---
name: config_network_ssh.write.detection
type: detection
meta:
  tags: [
      "config_network_ssh",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write", 
      "event_write_close", 
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1098.004", "account_manipulation:_ssh_authorized_keys",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1098.004 ]
  # Account Manipulation: SSH Authorized Keys
  comments:
    - detection rule - identify config_network_ssh_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_network_ssh_list.write.dependency)
condition: $dep_01
severity: 8



