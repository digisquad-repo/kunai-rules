# Detects write/write_close of server-side script files in web server document roots — web shell overwrite of existing files for persistent access.
---
name: fs_webshell_drop.write.detection
type: detection
meta:
  tags: [
      "fs_webshell_drop",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1505.003", "server_software_component:_web_shell",
    ]
  attack: [ T1505.003 ]
  # Server Software Component: Web Shell
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  comments:
    - detection rule - identify write/write_close of script extensions in web server document root directories

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai:
      - write
      - write_close

matches:
  $is_webdir: rule( path_webserver_docroot_list.write.dependency)
  $is_script: .data.path ~= "\.(php|php5|php7|phtml|asp|aspx|jsp|cgi|py|rb|pl)$"
condition: $is_webdir and $is_script

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 9
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
