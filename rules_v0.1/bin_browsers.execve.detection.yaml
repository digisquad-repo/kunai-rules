# Detects execution of web browsers (chrome, firefox, etc.). Low severity informational rule.
---
name: bin_browsers.execve.detection
type: detection
meta:
  tags: [
      "bin_browsers",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_execve",
      "event_execve_script",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1071.001", "application_layer_protocol:_web_protocols",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1071.001 ]
  # Application Layer Protocol: Web Protocols
  comments:
    - detection rule - identify bin_browsers_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

match-on:
  events:
    kunai: [execve, execve_script]

matches:
  $bin_dep_01: rule( bin_browsers_list.dependency)
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
severity: 4
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
