# Detects writes to Nginx web server configuration — may indicate web shell installation or reverse proxy configuration for C2.
---
name: config_network_nginx.write.detection
type: detection
meta:
  tags: [
      "config_network_nginx",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      # #
      "event_write",
      "event_write_close",
      "event_write_config",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1505.003", "server_software_component:_web_shell",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1505.003 ]
  # Server Software Component: Web Shell
  comments:
    - detection rule - identify config_network_nginx_list.write.dependency

match-on:
  events:
    kunai:
      - write
      - write_close
      - write_config

matches:
  $dep_01: rule( config_network_nginx_list.write.dependency)
condition: $dep_01
severity: 8
