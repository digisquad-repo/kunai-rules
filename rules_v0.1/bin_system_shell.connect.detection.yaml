# Detects network connections from shell interpreters — shells initiating connections indicates reverse shell or C2 beaconing.
---
name: bin_system_shell.connect.detection
type: detection
meta:
  tags: [
      "bin_system_shell",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "type_detection",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "event_connect",
      #### #### #### #### #### #### #### #### #### #### #### ####
      "T1059.004", "command_and_scripting_interpreter:_unix_shell",
    ]
  authors: [" hyde - Benjamin Collas - DIGISQUAD - https://www.digisquad.com"]
  attack: [ T1059.004 ]
  # Command and Scripting Interpreter: Unix Shell
  comments:
    - detection rule - identify CONNECT - apply on bin - bin_system_shell_list.dependency

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 

match-on:
  events:
    kunai: [connect]

matches:
  $bin_dep_01: rule(bin_system_shell_list.dependency) 
condition: $bin_dep_01

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### 
severity: 8
